<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prévia — Lukitas 3D cute</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0b0d; font-family: 'Inter', system-ui, sans-serif; }
  #cena { display: block; width: 100%; height: 100%; }
  .topo { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; color: #e9ebee; pointer-events: none; z-index: 2; }
  .topo h1 { font-size: clamp(15px, 2.6vw, 24px); font-weight: 700; letter-spacing: -.02em; }
  .topo p { font-size: 12px; color: #868d96; margin-top: 5px; }
  .dica { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); color: #9fd0ff; font-size: 12px; background: rgba(20,40,80,.5); padding: 7px 16px; border-radius: 999px; border: 1px solid rgba(120,180,255,.3); backdrop-filter: blur(6px); pointer-events: none; z-index: 2; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #7fb8ff; font-size: 14px; background: #0a0b0d; transition: opacity .5s; z-index: 3; }
</style>
</head>
<body>
  <div id="load">Carregando personagens 3D…</div>
  <div class="topo"><h1>Lukitas 3D — prévia "cute"</h1><p>Chibi estilo Pixar · baseado na sua foto</p></div>
  <div class="dica">Arraste para girar · Scroll para zoom</div>
  <canvas id="cena"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const canvas = document.getElementById('cena');
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0a0b0d, 15, 30);

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 3.2, 10);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.target.set(0, 1.55, 0);
  controls.minDistance = 4; controls.maxDistance = 20;
  controls.maxPolarAngle = Math.PI * 0.53;

  scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x101018, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 1.9);
  key.position.set(5, 10, 7); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 40;
  key.shadow.camera.left = -12; key.shadow.camera.right = 12;
  key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
  key.shadow.radius = 3; scene.add(key);
  const rim = new THREE.DirectionalLight(0x8aa0ff, 1.2);
  rim.position.set(-6, 4, -6); scene.add(rim);
  const fill = new THREE.PointLight(0x5cc8bd, 14, 22);
  fill.position.set(0, 2, 6); scene.add(fill);

  const chao = new THREE.Mesh(new THREE.CircleGeometry(20, 64),
    new THREE.MeshStandardMaterial({ color: 0x0e1015, roughness: 0.95, metalness: 0 }));
  chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; scene.add(chao);

  function mat(cor, rough, metal) {
    return new THREE.MeshStandardMaterial({ color: cor, roughness: rough == null ? 0.7 : rough, metalness: metal == null ? 0.05 : metal });
  }
  function contorno(mesh, cor) {
    const o = new THREE.Mesh(mesh.geometry, new THREE.MeshBasicMaterial({ color: cor || 0x241a12, side: THREE.BackSide }));
    o.scale.multiplyScalar(1.045);
    mesh.add(o);
    return mesh;
  }

  // Cores baseadas na SUA foto
  const CORES = { pele: 0xf6d3b0, cabelo: 0x4a3527, camisa: 0x6b4fa8, calca: 0x2b2f36, tenis: 0x2a2a33 };

  function criarChibi(cores) {
    const g = new THREE.Group();
    // CABECA (grande)
    const cabeca = new THREE.Mesh(new THREE.SphereGeometry(0.86, 44, 36), mat(cores.pele, 0.62));
    cabeca.position.y = 1.95; cabeca.scale.set(1, 1.03, 0.98);
    contorno(cabeca); cabeca.castShadow = true; g.add(cabeca);
    // OLHOS grandes
    [-0.29, 0.29].forEach(function (x) {
      const branco = new THREE.Mesh(new THREE.SphereGeometry(0.2, 26, 22), mat(0xffffff, 0.28));
      branco.position.set(x, 1.98, 0.78); branco.scale.set(1, 1.18, 0.5);
      const iris = new THREE.Mesh(new THREE.SphereGeometry(0.12, 22, 18), mat(0x3a2a1c, 0.3));
      iris.position.set(x, 1.97, 0.86); iris.scale.set(1, 1.15, 0.55);
      const brilho = new THREE.Mesh(new THREE.SphereGeometry(0.042, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      brilho.position.set(x + 0.05, 2.05, 0.94);
      const brilho2 = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      brilho2.position.set(x - 0.04, 1.9, 0.9);
      g.add(branco, iris, brilho, brilho2);
    });
    // SOBRANCELHAS
    [-0.29, 0.29].forEach(function (x) {
      const s = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, 0.08), mat(cores.cabelo, 0.7));
      s.position.set(x, 2.26, 0.72); s.rotation.z = x < 0 ? 0.18 : -0.18;
      s.scale.z = 0.6; g.add(s);
    });
    // NARIZ + BOCA + BLUSH
    const nariz = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), mat(cores.pele, 0.6));
    nariz.position.set(0, 1.83, 0.94);
    const boca = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), mat(0x8a4a44, 0.5));
    boca.position.set(0, 1.7, 0.9); boca.scale.set(1.5, 0.6, 0.4);
    g.add(nariz, boca);
    [-0.5, 0.5].forEach(function (x) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 12), mat(0xf2a8a8, 0.7));
      b.position.set(x, 1.8, 0.62); b.scale.set(1, 0.7, 0.35); g.add(b);
    });
    // CABELO ondulado
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.9, 44, 30, 0, Math.PI * 2, 0, Math.PI * 0.56), mat(cores.cabelo, 0.8));
    cap.position.y = 1.95; cap.scale.set(1.02, 1.08, 1.02); contorno(cap, 0x2a1e14); g.add(cap);
    const topete = new THREE.Mesh(new THREE.SphereGeometry(0.42, 26, 20), mat(cores.cabelo, 0.8));
    topete.position.set(0.14, 2.66, 0.16); topete.scale.set(1.35, 0.85, 1.2); topete.rotation.z = -0.3;
    contorno(topete, 0x2a1e14); g.add(topete);
    [-0.7, 0.7].forEach(function (x) {
      const l = new THREE.Mesh(new THREE.SphereGeometry(0.3, 22, 18), mat(cores.cabelo, 0.8));
      l.position.set(x, 2.02, 0.02); l.scale.set(0.72, 1.15, 0.95); contorno(l, 0x2a1e14); g.add(l);
    });
    // CORPO
    const corpo = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 0.42, 18, 34), mat(cores.camisa, 0.82));
    corpo.position.y = 0.98; corpo.scale.set(1.06, 1, 0.86); contorno(corpo); corpo.castShadow = true; g.add(corpo);
    // BRACOS + MAOS
    const bracoGeo = new THREE.CapsuleGeometry(0.14, 0.5, 10, 22);
    const maoGeo = new THREE.SphereGeometry(0.17, 18, 16);
    const bracos = [];
    [-1, 1].forEach(function (s) {
      const b = new THREE.Mesh(bracoGeo, mat(cores.camisa, 0.82));
      b.position.set(0.62 * s, 1.02, 0); b.rotation.z = 0.2 * s; b.castShadow = true; contorno(b);
      const m = new THREE.Mesh(maoGeo, mat(cores.pele, 0.6));
      m.position.set(0.74 * s, 0.66, 0); m.castShadow = true; contorno(m);
      g.add(b, m); bracos.push(b);
    });
    // PERNAS + TENIS
    const pernaGeo = new THREE.CapsuleGeometry(0.17, 0.42, 10, 22);
    [-0.25, 0.25].forEach(function (x) {
      const p = new THREE.Mesh(pernaGeo, mat(cores.calca, 0.8));
      p.position.set(x, 0.44, 0); p.castShadow = true; contorno(p);
      const t = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 16), mat(cores.tenis, 0.6));
      t.position.set(x, 0.15, 0.07); t.scale.set(1.15, 0.8, 1.35); t.castShadow = true; contorno(t);
      g.add(p, t);
    });
    return { g: g, bracos: bracos, maoEsq: null };
  }
  // ---------- 1) SKATISTA ----------
  const skat = criarChibi(CORES);
  skat.g.position.set(-3.7, 0.18, 0);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.12, 0.64), mat(0x5a7fc4, 0.55));
  deck.position.set(0, 0.05, 0.06); deck.castShadow = true; contorno(deck, 0x1b1524);
  skat.g.add(deck);
  const rodGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.16, 14);
  [[-0.6, -0.22], [-0.6, 0.3], [0.6, -0.22], [0.6, 0.3]].forEach(function (p) {
    const r = new THREE.Mesh(rodGeo, mat(0x1b1524, 0.5));
    r.rotation.z = Math.PI / 2; r.position.set(p[0], -0.03, p[1]); r.castShadow = true;
    skat.g.add(r);
  });
  scene.add(skat.g);

  // ---------- 2) CINEGRAFISTA ----------
  const cine = criarChibi(CORES);
  cine.bracos[0].rotation.x = -1.25; cine.bracos[1].rotation.x = -1.25;
  const cam = new THREE.Group();
  const camCorpo = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.44, 0.42), mat(0x26304a, 0.5));
  contorno(camCorpo, 0x141c2c); camCorpo.castShadow = true;
  const lente = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.36, 24), mat(0x7f9cc9, 0.35));
  lente.rotation.x = Math.PI / 2; lente.position.z = 0.34; contorno(lente, 0x141c2c);
  const recMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0xff6b6b, emissiveIntensity: 2 });
  const rec = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.07), recMat);
  rec.position.set(-0.22, 0.13, 0.22);
  cam.add(camCorpo, lente, rec);
  cam.position.set(0, 1.18, 0.7);
  cine.g.add(cam);
  cine.g.position.set(0, 0, 0);
  scene.add(cine.g);

  // ---------- 3) CONSTRUTOR ----------
  const cons = criarChibi(CORES);
  cons.bracos[0].rotation.z = 1.3; cons.bracos[1].rotation.z = -1.3;
  const blocos = [];
  [0xe0533d, 0xf2c94c, 0x4caf50].forEach(function (c, i) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.52, 0.52), mat(c, 0.7));
    contorno(b, 0x1b1524); b.castShadow = true;
    b.position.set(1.15, 0.3 + i * 0.56, 0.06);
    cons.g.add(b); blocos.push(b);
  });
  cons.g.position.set(3.7, 0, 0);
  scene.add(cons.g);

  // ---------- Animacao ----------
  const relogio = new THREE.Clock();
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += relogio.getDelta();
    skat.g.position.y = 0.18 + Math.sin(t * 2.2) * 0.05;
    skat.g.rotation.z = Math.sin(t * 1.6) * 0.05;
    skat.g.rotation.y = Math.sin(t * 0.5) * 0.14;
    cine.g.rotation.z = Math.sin(t * 1.1) * 0.04;
    cine.g.position.y = Math.sin(t * 1.7) * 0.03;
    recMat.emissiveIntensity = 1.4 + Math.sin(t * 5) * 1.4;
    cons.bracos[0].rotation.z = 1.25 + Math.sin(t * 1.4) * 0.22;
    cons.bracos[1].rotation.z = -1.25 - Math.sin(t * 1.4) * 0.22;
    blocos.forEach(function (b, i) {
      const fase = (t * 0.45 + i * 0.33) % 1;
      b.position.y = 0.3 + i * 0.56 + Math.max(0, Math.sin(fase * Math.PI)) * 1.0;
      b.rotation.y = t * 0.6 + i;
    });
    controls.update();
    renderer.render(scene, camera);
  }
  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  const load = document.getElementById('load');
  load.style.opacity = '0';
  setTimeout(function () { load.remove(); }, 500);
  animate();
  </script>
</body>
</html>
