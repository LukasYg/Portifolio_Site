<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prévia — Mascotes 3D (low-poly voxel)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0b0d; font-family: 'Inter', system-ui, sans-serif; }
  #cena { display: block; width: 100%; height: 100%; }
  .topo { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); text-align: center; color: #e9ebee; pointer-events: none; }
  .topo h1 { font-size: clamp(16px, 3vw, 26px); font-weight: 700; letter-spacing: -.02em; }
  .topo p { font-size: 13px; color: #868d96; margin-top: 6px; }
  .dica { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: #9fd0ff; font-size: 12px; background: rgba(20,40,80,.5); padding: 7px 16px; border-radius: 999px; border: 1px solid rgba(120,180,255,.3); backdrop-filter: blur(6px); pointer-events: none; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #7fb8ff; font-size: 14px; background: #0a0b0d; transition: opacity .5s; }
</style>
</head>
<body>
  <div id="load">Carregando mascotes 3D…</div>
  <div class="topo">
    <h1>🧊 Mascotes em 3D — prévia</h1>
    <p>Low-poly / voxel, mesma paleta do site</p>
  </div>
  <div class="dica">🖱️ Arraste para girar · Scroll para zoom</div>
  <canvas id="cena"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const canvas = document.getElementById('cena');
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0a0b0d, 14, 26);

  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 3.4, 9.5);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.target.set(0, 1.5, 0);
  controls.minDistance = 4;
  controls.maxDistance = 18;
  controls.maxPolarAngle = Math.PI * 0.52;

  // Luzes suaves
  scene.add(new THREE.HemisphereLight(0x9fd0ff, 0x0a0b0d, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 2.1);
  key.position.set(5, 9, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 40;
  key.shadow.camera.left = -10; key.shadow.camera.right = 10;
  key.shadow.camera.top = 10; key.shadow.camera.bottom = -10;
  scene.add(key);
  const rim = new THREE.PointLight(0x5cc8bd, 30, 26);
  rim.position.set(-6, 3, -5);
  scene.add(rim);

  // Chao
  const chao = new THREE.Mesh(
    new THREE.CircleGeometry(16, 64),
    new THREE.MeshStandardMaterial({ color: 0x101216, roughness: 0.9, metalness: 0.1 })
  );
  chao.rotation.x = -Math.PI / 2;
  chao.receiveShadow = true;
  scene.add(chao);
  function mat(cor, rough) {
    return new THREE.MeshStandardMaterial({ color: cor, roughness: rough == null ? 0.75 : rough, metalness: 0.15 });
  }
  function bloco(w, h, d, cor) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(cor));
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  const OLHO = new THREE.MeshStandardMaterial({ color: 0x1b1524, roughness: 0.5 });

  function criarBase(cores) {
    const g = new THREE.Group();
    const cabeca = bloco(0.86, 0.86, 0.86, cores.pele);
    cabeca.position.y = 1.74; g.add(cabeca);
    const olhoGeo = new THREE.BoxGeometry(0.1, 0.15, 0.06);
    const oE = new THREE.Mesh(olhoGeo, OLHO); oE.position.set(-0.17, 1.78, 0.44);
    const oD = new THREE.Mesh(olhoGeo, OLHO); oD.position.set(0.17, 1.78, 0.44);
    const boca = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.05, 0.05), OLHO);
    boca.position.set(0, 1.62, 0.44);
    g.add(oE, oD, boca);
    const corpo = bloco(0.72, 0.92, 0.46, cores.camisa);
    corpo.position.y = 1.08; g.add(corpo);
    const bracoGeo = new THREE.BoxGeometry(0.2, 0.72, 0.2);
    const bE = new THREE.Mesh(bracoGeo, mat(cores.camisa)); bE.castShadow = true;
    bE.position.set(-0.47, 1.14, 0);
    const bD = new THREE.Mesh(bracoGeo, mat(cores.camisa)); bD.castShadow = true;
    bD.position.set(0.47, 1.14, 0);
    g.add(bE, bD);
    const pernaGeo = new THREE.BoxGeometry(0.24, 0.66, 0.24);
    const pE = new THREE.Mesh(pernaGeo, mat(cores.calca)); pE.castShadow = true;
    pE.position.set(-0.18, 0.33, 0);
    const pD = new THREE.Mesh(pernaGeo, mat(cores.calca)); pD.castShadow = true;
    pD.position.set(0.18, 0.33, 0);
    g.add(pE, pD);
    return { g: g, cabeca: cabeca, bE: bE, bD: bD };
  }

  // ---------- Skatista (chapeu de palha + skate) ----------
  const CORES_SKAT = { pele: 0xf2c79b, camisa: 0xe0533d, calca: 0x2f5fa0 };
  const skat = criarBase(CORES_SKAT);
  const abaS = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.08, 24), mat(0xf2c94c));
  abaS.position.y = 2.16; abaS.castShadow = true;
  const copaS = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.32, 24), mat(0xf7d977));
  copaS.position.y = 2.32; copaS.castShadow = true;
  skat.g.add(abaS, copaS);
  // skate
  const deck = bloco(1.5, 0.1, 0.5, 0x5a7fc4);
  deck.position.set(0, 0.06, 0.05);
  const rodGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.14, 12);
  const rodMat = mat(0x1b1524);
  [[-0.55, -0.18], [-0.55, 0.28], [0.55, -0.18], [0.55, 0.28]].forEach(function (p) {
    const r = new THREE.Mesh(rodGeo, rodMat);
    r.rotation.z = Math.PI / 2;
    r.position.set(p[0], 0.0, p[1]);
    r.castShadow = true;
    skat.g.add(r);
  });
  skat.g.add(deck);
  skat.g.position.set(-3.4, 0, 0);
  scene.add(skat.g);
  
  // ---------- Cinegrafista (bone + camera) ----------
  const CORES_CINE = { pele: 0xf2c79b, camisa: 0x2f4a6b, calca: 0x2b2f36 };
  const cine = criarBase(CORES_CINE);
  const copaC = bloco(0.9, 0.28, 0.9, 0x4caf50); copaC.position.y = 2.24;
  const abaC = bloco(0.8, 0.12, 0.34, 0x38813c); abaC.position.set(0, 2.1, 0.42);
  cine.g.add(copaC, abaC);
  const camCorpo = bloco(0.62, 0.42, 0.4, 0x26304a); camCorpo.position.set(0, 1.2, 0.5);
  const lente = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.3, 20), mat(0x7f9cc9, 0.4));
  lente.rotation.x = Math.PI / 2; lente.position.set(0.12, 1.2, 0.78); lente.castShadow = true;
  const recMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0xff6b6b, emissiveIntensity: 2 });
  const rec = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), recMat);
  rec.position.set(-0.2, 1.3, 0.71);
  cine.g.add(camCorpo, lente, rec);
  scene.add(cine.g);

  // ---------- Construtor (capacete + blocos) ----------
  const CORES_CONS = { pele: 0xf2c79b, camisa: 0xe0863d, calca: 0x3a4250 };
  const cons = criarBase(CORES_CONS);
  const helmo = new THREE.Mesh(new THREE.SphereGeometry(0.48, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xf2c94c));
  helmo.position.y = 2.16; helmo.castShadow = true;
  const helmoAba = bloco(0.98, 0.1, 0.62, 0xcfa32f); helmoAba.position.set(0, 2.14, 0.5);
  cons.g.add(helmo, helmoAba);
  const coresBloco = [0xe0533d, 0xf2c94c, 0x4caf50];
  const blocos = [];
  coresBloco.forEach(function (c, i) {
    const b = bloco(0.5, 0.5, 0.5, c);
    b.position.set(1.0, 0.25 + i * 0.52, 0.05);
    cons.g.add(b); blocos.push(b);
  });
  cons.g.position.set(3.3, 0, 0);
  scene.add(cons.g);

  // ---------- Animacao ----------
  const relogio = new THREE.Clock();
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += relogio.getDelta();
    skat.g.position.y = Math.sin(t * 2.2) * 0.06;
    skat.g.rotation.z = Math.sin(t * 1.6) * 0.05;
    skat.g.rotation.y = Math.sin(t * 0.5) * 0.16;
    cine.g.rotation.z = Math.sin(t * 1.1) * 0.05;
    cine.bE.rotation.x = -1.2 + Math.sin(t * 1.3) * 0.12;
    cine.bD.rotation.x = -1.2 + Math.sin(t * 1.3 + 0.4) * 0.12;
    recMat.emissiveIntensity = 1.4 + Math.sin(t * 5) * 1.4;
    cons.bE.rotation.z = 1.5 + Math.sin(t * 1.4) * 0.25;
    cons.bD.rotation.z = -1.5 - Math.sin(t * 1.4) * 0.25;
    blocos.forEach(function (b, i) {
      const fase = (t * 0.5 + i * 0.33) % 1;
      b.position.y = 0.25 + i * 0.52 + Math.max(0, Math.sin(fase * Math.PI)) * 0.9;
      b.rotation.y = t * 0.6 + i;
    });
    controls.update();
    renderer.render(scene, camera);
  }
  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  const load = document.getElementById('load');
  load.style.opacity = '0';
  setTimeout(function () { load.remove(); }, 500);
  animate();
  </script>
</body>
</html>
